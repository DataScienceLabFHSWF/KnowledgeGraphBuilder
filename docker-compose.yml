# KnowledgeGraphBuilder — Standalone Docker Compose
#
# Brings up all infrastructure + the KGB API in one command.
# Models are pulled automatically on first run.
#
# Usage (profile is derived from LLM_BACKEND in .env):
#   docker compose up -d              # start selected model provider + services
#   docker compose up -d --build      # rebuild API image + start
#   docker compose logs -f kgb-api    # follow API logs
#
# When running inside KGPlatform, this file is NOT used.
# KGPlatform's root docker-compose.yml handles everything.

services:
  # ── KGBuilder API ──────────────────────────────────────────
  kgb-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: kgb-api
    restart: unless-stopped
    ports:
      - "${UVICORN_PORT:-8001}:8001"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - QDRANT_URL=http://kgb-qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-kgbuilder}
      - NEO4J_URI=bolt://kgb-neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-changeme}
      - FUSEKI_URL=http://kgb-fuseki:3030
      - FUSEKI_DATASET=${FUSEKI_DATASET:-kgbuilder}
      - OLLAMA_URL=http://kgb-ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:e2b}
      - LLM_BACKEND=${LLM_BACKEND:-ollama}
      - LLM_MODEL=${LLM_MODEL:-}
      - VLLM_MODEL=${VLLM_MODEL:-Qwen/Qwen3-8B}
      - VLLM_BASE_URL=http://kgb-vllm:8000/v1
      - VLLM_EMBEDDING_BASE_URL=http://kgb-vllm-embeddings:8000/v1
      - VLLM_EMBEDDING_MODEL=${VLLM_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      - VLLM_API_KEY=${VLLM_API_KEY:-EMPTY}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-}
      - LLM_TOP_P=${LLM_TOP_P:-0.9}
      - LLM_SEED=${LLM_SEED:-}
      - LLM_CHAT_TEMPLATE_KWARGS=${LLM_CHAT_TEMPLATE_KWARGS:-{}}
      - LLM_CACHE_ENABLED=${LLM_CACHE_ENABLED:-true}
      - GRAPHQA_API_URL=${GRAPHQA_API_URL:-}
      - ONTOLOGY_API_URL=${ONTOLOGY_API_URL:-}
    depends_on:
      kgb-neo4j:
        condition: service_started
      kgb-qdrant:
        condition: service_started
      kgb-fuseki:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - kgbuilder-net

  # ── KGBuilder CLI runner (optional, for batch runs) ────────
  kgb-runner:
    build: .
    container_name: kgb-runner
    profiles: ["runner"]
    volumes:
      - ./:/app
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - QDRANT_URL=http://kgb-qdrant:6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-kgbuilder}
      - NEO4J_URI=bolt://kgb-neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-changeme}
      - FUSEKI_URL=http://kgb-fuseki:3030
      - FUSEKI_DATASET=${FUSEKI_DATASET:-kgbuilder}
      - OLLAMA_URL=http://kgb-ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:e2b}
      - LLM_BACKEND=${LLM_BACKEND:-ollama}
      - LLM_MODEL=${LLM_MODEL:-}
      - VLLM_MODEL=${VLLM_MODEL:-Qwen/Qwen3-8B}
      - VLLM_BASE_URL=http://kgb-vllm:8000/v1
      - VLLM_EMBEDDING_BASE_URL=http://kgb-vllm-embeddings:8000/v1
      - VLLM_EMBEDDING_MODEL=${VLLM_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      - VLLM_API_KEY=${VLLM_API_KEY:-EMPTY}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-}
      - LLM_TOP_P=${LLM_TOP_P:-0.9}
      - LLM_SEED=${LLM_SEED:-}
      - LLM_CHAT_TEMPLATE_KWARGS=${LLM_CHAT_TEMPLATE_KWARGS:-{}}
      - LLM_CACHE_ENABLED=${LLM_CACHE_ENABLED:-true}
    depends_on:
      kgb-neo4j:
        condition: service_started
      kgb-qdrant:
        condition: service_started
      kgb-fuseki:
        condition: service_started
    networks:
      - kgbuilder-net

  # ── Infrastructure ─────────────────────────────────────────
  kgb-qdrant:
    image: qdrant/qdrant:latest
    container_name: kgb-qdrant
    restart: unless-stopped
    volumes:
      - ./data/qdrant:/qdrant/storage
    ports:
      - "6333:6333"
    networks:
      - kgbuilder-net

  kgb-neo4j:
    image: neo4j:5.26.0
    container_name: kgb-neo4j
    restart: unless-stopped
    environment:
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
      - NEO4J_PLUGINS=["apoc", "n10s"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,n10s.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,n10s.*
    volumes:
      - ./data/neo4j:/data
      - neo4j-plugins:/plugins
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - kgbuilder-net

  kgb-fuseki:
    image: stain/jena-fuseki:latest
    container_name: kgb-fuseki
    restart: unless-stopped
    ports:
      - "3030:3030"
    volumes:
      - ./data/fuseki:/fuseki
    environment:
      - ADMIN_PASSWORD=${FUSEKI_ADMIN_PASSWORD:-admin}
      - FUSEKI_DATASET_1=${FUSEKI_DATASET:-kgbuilder}
      - FUSEKI_DATASET_2=kgbuilder-staging
    networks:
      - kgbuilder-net

  # ── Ollama + model init ────────────────────────────────────
  kgb-ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.35.0}
    profiles: ["ollama"]
    container_name: kgb-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_ALLOW_DOWNLOADS=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kgbuilder-net

  kgb-ollama-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.35.0}
    profiles: ["ollama"]
    container_name: kgb-ollama-init
    depends_on:
      kgb-ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=kgb-ollama:11434
      - OLLAMA_DECISION_MODEL=${OLLAMA_DECISION_MODEL:-none}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling models for KGBuilder..."
        ollama pull ${OLLAMA_MODEL:-gemma4:e2b}
        ollama pull ${OLLAMA_EMBED_MODEL:-qwen3-embedding}
        decision_model="$${OLLAMA_DECISION_MODEL:-none}"
        if [ -n "$${decision_model}" ] && [ "$${decision_model}" != "none" ]; then
          ollama pull "$${decision_model}"
        fi
        echo "KGBuilder models ready."
    restart: "no"
    networks:
      - kgbuilder-net

  kgb-vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.29.0}
    container_name: kgb-vllm
    profiles: ["vllm"]
    restart: unless-stopped
    environment:
      - CUDA_VISIBLE_DEVICES=${VLLM_GPU_DEVICE:-0}
    command:
      - --model
      - ${VLLM_MODEL:-Qwen/Qwen3-8B}
      - --served-model-name
      - ${VLLM_MODEL:-Qwen/Qwen3-8B}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --api-key
      - ${VLLM_API_KEY:-EMPTY}
    ports:
      - "127.0.0.1:${VLLM_PORT:-8000}:8000"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - kgbuilder-net

  kgb-vllm-embeddings:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.29.0}
    container_name: kgb-vllm-embeddings
    profiles: ["vllm"]
    restart: unless-stopped
    environment:
      - CUDA_VISIBLE_DEVICES=${VLLM_EMBEDDING_GPU_DEVICE:-0}
    command:
      - --model
      - ${VLLM_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      - --served-model-name
      - ${VLLM_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      - --task
      - embed
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --api-key
      - ${VLLM_API_KEY:-EMPTY}
    ports:
      - "127.0.0.1:${VLLM_EMBEDDING_PORT:-8002}:8000"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - kgbuilder-net

  # Kolibri requires Aleph Alpha's plugin image, which pins its supported vLLM.
  # Set COMPOSE_PROFILES=kolibri, LLM_BACKEND=vllm, and VLLM_MODEL=Aleph-Alpha/Kolibri-1.
  kgb-vllm-kolibri:
    image: ${KOLIBRI_VLLM_IMAGE:-ghcr.io/aleph-alpha/aleph-alpha-inference@sha256:ac93d782890eb942dd59afa7cee9fa1e681d09f63a0036b21ea7664a254ed7d5}
    container_name: kgb-vllm-kolibri
    profiles: ["kolibri"]
    restart: unless-stopped
    environment:
      - CUDA_VISIBLE_DEVICES=${KOLIBRI_GPU_DEVICE:-0}
      - HF_HOME=/root/.cache/huggingface
    command:
      - Aleph-Alpha/Kolibri-1
      - --revision
      - ${KOLIBRI_MODEL_REVISION:-e52eb4627d11516b0c01de49210ab5a4e4061444}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --kv-cache-dtype
      - fp8
      - --reasoning-parser
      - kolibri1
      - --tool-call-parser
      - kolibri1
      - --enable-auto-tool-choice
      - --max-model-len
      - ${KOLIBRI_MAX_MODEL_LEN:-32768}
      - --gpu-memory-utilization
      - ${KOLIBRI_GPU_MEMORY_UTILIZATION:-0.9}
    ports:
      - "127.0.0.1:${VLLM_PORT:-8000}:8000"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      kgbuilder-net:
        aliases:
          - kgb-vllm

  kgb-vllm-kolibri-embeddings:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.29.0}
    container_name: kgb-vllm-kolibri-embeddings
    profiles: ["kolibri"]
    restart: unless-stopped
    environment:
      - CUDA_VISIBLE_DEVICES=${KOLIBRI_GPU_DEVICE:-0}
    command:
      - --model
      - ${VLLM_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      - --served-model-name
      - ${VLLM_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      - --task
      - embed
      - --gpu-memory-utilization
      - ${VLLM_EMBEDDING_GPU_MEMORY_UTILIZATION:-0.05}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --api-key
      - ${VLLM_API_KEY:-EMPTY}
    ports:
      - "127.0.0.1:${VLLM_EMBEDDING_PORT:-8002}:8000"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      kgbuilder-net:
        aliases:
          - kgb-vllm-embeddings

volumes:
  neo4j-plugins:
  ollama-data:
  huggingface-cache:

networks:
  kgbuilder-net:
    driver: bridge
